[project]
name = "multimodal-ml"
description = "CA vs CP in multimodal representation learning under the Spiked Covariance Model."
authors = [
    {name = "Anonymous"},
]
license = {text = "MIT"}
readme = {file = "README.md", content-type = "text/markdown"}
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "pandas",
    "scikit-learn",
]
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
